<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案例编写 — ESG 披露收资工具</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  /* ---------- 头部导航 ---------- */
  header.page{position:relative}
  header.page .backhome{position:absolute;right:2px;top:7px;font-size:12.5px;color:#8a8f99;text-decoration:none}
  header.page .backhome:hover{color:#2f6bff}

  /* ---------- 工具条 ---------- */
  .cs-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .cs-toolbar .input{max-width:240px}
  .cs-toolbar .select{width:auto;padding:7px 30px 7px 11px}
  .cs-toolbar .grow{flex:1}
  .btn-primary{border:none;background:#2f6bff;color:#fff;border-radius:6px;padding:7px 18px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-primary:hover{background:#1f59e0}

  /* ---------- 案例列表 ---------- */
  table.cs-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
  table.cs-table th{background:#f7f8fa;color:#5c5f66;font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid #e9ecf1;white-space:nowrap}
  table.cs-table td{padding:10px;border-bottom:1px solid #f0f2f5;color:#1f2329;vertical-align:top}
  table.cs-table tr:hover td{background:#fafbfc}
  .cs-title{font-weight:600;cursor:pointer;color:#1f2329}
  .cs-title:hover{color:#2f6bff}
  .cs-no{font-size:11px;color:#a4a9b1;font-weight:400;margin-left:6px}
  .cs-cats .c-badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;margin-right:4px;white-space:nowrap}
  .c-e{background:#e6f6ec;color:#12934f}
  .c-s{background:#e6efff;color:#2f6bff}
  .c-g{background:#f0e9ff;color:#6b4fbb}
  .cs-topics{font-size:12px;color:#8a8f99;max-width:180px}
  .cs-status{display:inline-block;font-size:11px;padding:1px 8px;border-radius:8px;white-space:nowrap}
  .st-draft{background:#fff3e6;color:#c25e00}
  .st-final{background:#e6f6ec;color:#12934f}
  .cs-ops{white-space:nowrap}
  .cs-ops button{background:none;border:none;font-size:12.5px;color:#8a8f99;cursor:pointer;padding:2px 5px;font-family:inherit}
  .cs-ops button:hover{color:#2f6bff}
  .cs-ops .del:hover{color:#d4380d}
  .cs-time{font-size:12px;color:#9aa0aa;white-space:nowrap}

  /* ---------- 弹窗 ---------- */
  .m-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px}
  .m-box{background:#f3f5f9;border-radius:12px;width:920px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(15,23,42,.25)}
  .m-hd{display:flex;align-items:center;gap:10px;padding:14px 22px;background:#fff;border-radius:12px 12px 0 0;border-bottom:1px solid #eef0f4}
  .m-hd h3{font-size:15px;font-weight:600}
  .m-hd .m-no{font-size:12px;color:#9aa0aa}
  .m-hd .m-close{margin-left:auto;background:none;border:none;font-size:18px;color:#8a8f99;cursor:pointer;padding:2px 8px}
  .m-hd .m-close:hover{color:#1f2329}
  .m-bd{overflow-y:auto;padding:18px 22px}
  .m-ft{display:flex;gap:10px;padding:12px 22px;background:#fff;border-radius:0 0 12px 12px;border-top:1px solid #eef0f4;align-items:center}
  .m-ft .m-hint{font-size:12px;color:#9aa0aa}
  .m-ft .right{margin-left:auto;display:flex;gap:10px}

  .m-sec{background:#fff;border-radius:10px;padding:16px 20px;margin-bottom:14px}
  .m-sec h4{font-size:13.5px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .m-sec h4 .sn{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#e6efff;color:#2f6bff;font-size:12px;align-items:center;justify-content:center}
  .m-sec details{border:none;background:transparent}
  .m-sec details summary{cursor:pointer;font-size:13.5px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
  .m-sec details summary::-webkit-details-marker{display:none}
  .m-sec details summary::before{content:"▸";color:#9aa0aa;transition:.15s}
  .m-sec details[open] summary::before{transform:rotate(90deg)}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:6px}
  .m-grid .full{grid-column:1/-1}
  .m-grid label{display:block;font-size:12.5px;color:#4c515a;margin-bottom:5px}
  @media(max-width:720px){.m-grid{grid-template-columns:1fr}}

  .chip-group{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}
  .chip-check{border:1px solid #d8dce3;background:#fff;border-radius:14px;padding:3px 13px;font-size:12.5px;color:#5c5f66;cursor:pointer;user-select:none}
  .chip-check.on{border-color:#2f6bff;background:#eef4ff;color:#2f6bff;font-weight:500}
  .chip-add{display:flex;gap:6px;margin-top:8px}
  .chip-add .input{max-width:200px;padding:5px 10px;font-size:12.5px}

  /* 动态行 */
  .dyn{border:1px solid #e6e9ef;border-radius:8px;padding:12px 14px;margin-top:10px;position:relative}
  .dyn .dyn-x{position:absolute;right:10px;top:8px;background:none;border:none;color:#b0b5bd;cursor:pointer;font-size:14px}
  .dyn .dyn-x:hover{color:#d4380d}
  .dyn .dyn-no{font-size:12px;color:#9aa0aa;font-weight:600;margin-bottom:6px}
  table.mt{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
  table.mt th{background:#f7f8fa;color:#5c5f66;font-weight:500;text-align:left;padding:6px 8px;white-space:nowrap}
  table.mt td{padding:3px 4px 3px 0}
  table.mt .input{padding:6px 8px;font-size:12.5px}
  .add-row{margin-top:10px}

  /* ---------- 预览 ---------- */
  .pv-doc{background:#fff;border-radius:10px;padding:26px 30px;font-size:13.5px;line-height:1.75}
  .pv-doc h2{font-size:17px;margin-bottom:2px}
  .pv-doc .pv-meta{color:#8a8f99;font-size:12.5px;margin-bottom:14px}
  .pv-doc h5{font-size:13.5px;color:#2f6bff;margin:16px 0 4px}
  .pv-doc p{margin:4px 0;white-space:pre-wrap}
  .pv-doc table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px}
  .pv-doc th{background:#f7f8fa;text-align:left;padding:6px 10px;border:1px solid #e9ecf1;color:#5c5f66;font-weight:500}
  .pv-doc td{padding:6px 10px;border:1px solid #eef0f4}
  .pv-doc .pv-act{margin:6px 0}
  .pv-doc .pv-act b{color:#1f2329}
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <h1>案例编写</h1>
    <div class="sub">集中新增、编辑和管理 ESG 实践案例，主线「问题—目标—行动—结果—证据」，产出可用于报告正文 · 数据保存在本浏览器</div>
    <a class="backhome" href="index.html">← 返回填报工具</a>
  </header>

  <!-- ============ 工具条 + 列表 ============ -->
  <section class="card">
    <h2>案例列表 <span class="h2sub" id="cntTxt"></span>
      <span class="toolbar">
        <button class="tool-btn" id="btnTpl">⇩ 下载填报模板</button>
        <button class="btn-primary" id="btnNew">＋ 新增案例</button>
      </span>
    </h2>
    <div class="cs-toolbar">
      <input class="input" id="f_kw" placeholder="搜索名称 / 单位 / 议题">
      <select class="select" id="f_cat"><option value="">全部类别</option><option value="E">环境 E</option><option value="S">社会 S</option><option value="G">治理 G</option></select>
      <select class="select" id="f_ps"><option value="">全部项目状态</option></select>
      <select class="select" id="f_st"><option value="">全部状态</option><option value="draft">草稿</option><option value="final">已定稿</option></select>
    </div>
    <div id="listWrap"></div>
  </section>

</div>

<!-- ============ 编辑弹窗 ============ -->
<div class="m-mask" id="editMask" style="display:none">
  <div class="m-box">
    <div class="m-hd">
      <h3 id="mTitle">新增案例</h3>
      <span class="m-no" id="mNo"></span>
      <button class="m-close" id="mClose" title="关闭">✕</button>
    </div>
    <div class="m-bd">

      <div class="m-sec">
        <h4><span class="sn">1</span>基础信息</h4>
        <div class="m-grid">
          <div class="full"><label><span class="req">*</span>案例名称（建议 20—40 字，体现核心行动及成效）</label><input class="input" id="c_title"></div>
          <div class="full"><label><span class="req">*</span>ESG 类别（可多选）</label><div class="chip-group" id="c_esg"></div></div>
          <div class="full"><label>关联 ESG 议题（可多选，可自定义）</label><div class="chip-group" id="c_topics"></div>
            <div class="chip-add"><input class="input" id="c_topicCustom" placeholder="自定义议题"><button class="tool-btn" id="btnAddTopic">添加</button></div>
          </div>
          <div><label><span class="req">*</span>案例类型</label><select class="select" id="c_type"></select></div>
          <div><label><span class="req">*</span>项目状态</label><select class="select" id="c_status"></select></div>
          <div><label><span class="req">*</span>实施单位/部门</label><input class="input" id="c_unit" placeholder="牵头实施的公司、子公司或部门"></div>
          <div><label>实施地点</label><input class="input" id="c_loc" placeholder="国家、省市、园区、工厂或社区"></div>
          <div><label><span class="req">*</span>实施开始时间</label><input class="input" id="c_start" type="date"></div>
          <div><label>结束时间 <span style="color:#9aa0aa;font-weight:400">（勾选持续开展可留空）</span></label>
            <div style="display:flex;gap:10px;align-items:center"><input class="input" id="c_end" type="date" style="flex:1">
            <label style="margin:0;white-space:nowrap;font-size:12.5px;color:#4c515a"><input type="checkbox" id="c_ongoing"> 持续开展</label></div>
          </div>
        </div>
      </div>

      <div class="m-sec">
        <h4><span class="sn">2</span>背景与目标</h4>
        <div class="m-grid">
          <div class="full"><label><span class="req">*</span>背景与问题（建议 100—300 字，说明原因、面临的问题及利益相关方需求）</label><textarea class="ta" id="c_bg"></textarea></div>
          <div class="full"><label><span class="req">*</span>项目目标（有量化目标时写明目标值及期限）</label><textarea class="ta" id="c_goal" style="min-height:56px"></textarea></div>
        </div>
      </div>

      <div class="m-sec">
        <h4><span class="sn">3</span>主要行动（建议 2—5 项）</h4>
        <div id="actList"></div>
        <button class="tool-btn add-row" id="btnAddAct">＋ 新增行动</button>
      </div>

      <div class="m-sec">
        <h4><span class="sn">4</span>成果与影响</h4>
        <div class="m-grid">
          <div class="full"><label><span class="req">*</span>成果与影响（建议 100—300 字，环境/社会/治理/经营成效）</label><textarea class="ta" id="c_outcome"></textarea></div>
          <div class="full"><label>受益对象/利益相关方</label><input class="input" id="c_benef" placeholder="如：员工、客户、供应商、社区居民"></div>
          <div class="full"><label>创新亮点及可复制价值</label><textarea class="ta" id="c_innov" style="min-height:56px"></textarea></div>
        </div>
      </div>

      <div class="m-sec">
        <h4><span class="sn">5</span>量化成效指标（有数据时建议填写，含口径与来源）</h4>
        <table class="mt" id="mtTable">
          <thead><tr><th style="width:18%">指标名称</th><th>基准值</th><th>当期值</th><th style="width:9%">单位</th><th style="width:13%">统计期间</th><th style="width:14%">统计范围</th><th style="width:14%">数据来源</th><th style="width:34px"></th></tr></thead>
          <tbody id="mtBody"></tbody>
        </table>
        <button class="tool-btn add-row" id="btnAddMt">＋ 新增指标</button>
      </div>

      <div class="m-sec">
        <details id="extraSec">
          <summary><span class="sn" style="display:inline-flex;width:20px;height:20px;border-radius:50%;background:#e6efff;color:#2f6bff;font-size:12px;align-items:center;justify-content:center">6</span>补充信息（选填）</summary>
          <div class="m-grid">
            <div class="full"><label>合作机构</label><input class="input" id="c_partners" placeholder="政府、科研院所、公益组织、供应商等，多个用顿号分隔"></div>
            <div class="full"><label>困难与经验总结</label><textarea class="ta" id="c_diff" style="min-height:56px" placeholder="客观说明实施难点、限制及经验"></textarea></div>
            <div class="full"><label>后续计划</label><textarea class="ta" id="c_next" style="min-height:56px"></textarea></div>
            <div class="full"><label>公开来源链接</label><input class="input" id="c_links" placeholder="公司官网、新闻稿、政府或合作机构网页，多个用换行分隔"></div>
          </div>
        </details>
      </div>

      <div class="m-sec">
        <h4><span class="sn">7</span>佐证与内部管理</h4>
        <div class="m-grid">
          <div class="full"><label>数据口径及来源（有量化数据时必填：数据来源、计算方法、统计边界、是否经审核）</label><textarea class="ta" id="c_scope" style="min-height:56px"></textarea></div>
          <div><label>信息公开级别</label><select class="select" id="c_secrecy"><option>可公开</option><option>审核后公开</option><option>仅内部使用</option><option>涉密</option></select></div>
        </div>
      </div>

    </div>
    <div class="m-ft">
      <span class="m-hint" id="mHint">草稿只需填写案例名称；定稿需完成所有必填项</span>
      <span class="right">
        <button class="tool-btn" id="btnCancel">取消</button>
        <button class="tool-btn" id="btnSaveDraft">保存草稿</button>
        <button class="btn-primary" id="btnSaveFinal">保存并定稿</button>
      </span>
    </div>
  </div>
</div>

<!-- ============ 预览弹窗 ============ -->
<div class="m-mask" id="pvMask" style="display:none">
  <div class="m-box" style="width:820px">
    <div class="m-hd">
      <h3>案例预览</h3>
      <button class="m-close" id="pvClose" title="关闭">✕</button>
    </div>
    <div class="m-bd"><div class="pv-doc" id="pvDoc"></div></div>
    <div class="m-ft"><span class="m-hint">预览版式接近报告正文呈现，可复制文本使用</span>
      <span class="right"><button class="tool-btn" id="pvOk">关闭</button></span>
    </div>
  </div>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script>
/* ================= 配置 ================= */
const LS_KEY = 'esgTool.cases.v1';
const ESG_CATS = ['E','S','G'];
const CAT_NAME = {E:'环境 E', S:'社会 S', G:'治理 G'};
const TOPIC_PRESETS = ['气候变化','能源管理','循环经济','水资源','污染防治','生物多样性','员工发展','职业健康安全','供应链责任','产品质量与安全','数据安全与隐私','社区公益','乡村振兴','商业道德','公司治理','风险管理'];
const CASE_TYPES = ['运营改善','产品与服务','供应链','员工','公益','治理','技术创新','其他'];
const PROJ_STATUS = ['筹备中','实施中','已完成','持续开展'];

const SEED = [{
  id:'seed-demo-1', no:'AL-0001', title:'【示例】厂区分布式光伏项目实现年减排二氧化碳约 800 吨',
  esgCat:['E'], topics:['气候变化','能源管理'], caseType:'运营改善', unit:'华南分公司',
  startDate:'2025-03-01', endDate:'2025-09-30', ongoing:false, location:'广东省深圳市光明区产业园', projStatus:'已完成',
  background:'园区年用电量约 1200 万 kWh，全部依赖市电，其中约 15% 为高峰时段高价电。为响应公司碳中和目标并降低用能成本，2025 年启动屋顶分布式光伏项目。',
  goal:'利用园区 3 栋厂房合计约 1.2 万平方米闲置屋顶建设分布式光伏电站，目标年发电量不低于 110 万 kWh，自发自用比例达到 90% 以上。',
  actions:[
    {title:'完成屋顶荷载评估与方案设计', content:'委托第三方机构完成屋顶结构安全评估，确定装机容量 1.1 MWp 的铺设方案。', owner:'工程部', time:'2025年3—4月'},
    {title:'招标与建设施工', content:'通过公开招标选定 EPC 总包方，历时 4 个月完成安装、并网验收。', owner:'采购部、工程部', time:'2025年5—8月'},
    {title:'并网运行与智能运维', content:'接入园区能源管理系统，实现发电数据实时监测与异常预警。', owner:'设施管理部', time:'2025年9月起'}
  ],
  outcome:'项目于 2025 年 9 月全容量并网。截至 2026 年 9 月首个完整运行年度，累计发电 118 万 kWh，占园区用电量 9.8%，自发自用比例 93%，年节约电费约 86 万元，减排二氧化碳约 800 吨。',
  benef:'公司（降本）、园区所在电网（削峰）、当地社区（减排）',
  innovation:'采用「自发自用、余电上网」模式并与能源管理系统联动，该模式可复制到公司其他自持园区。',
  metrics:[{name:'年发电量', base:'0', current:'118', unit:'万kWh', period:'2025.10—2026.09', scope:'光明区产业园', source:'能源管理系统'}],
  partners:'区供电局、EPC 总包方', difficulties:'', nextPlan:'2027 年评估二期扩建及配套储能可行性。',
  links:'', scope:'发电量数据来源于园区能源管理系统月度结算报表，减排量按区域电网排放因子折算，未经第三方核查。',
  secrecy:'可公开', status:'final', createdAt:'2026-10-01T09:00:00.000Z', updatedAt:'2026-10-20T08:00:00.000Z'
}];

/* ================= 数据层 ================= */
let cases = [];
let editingId = null;
let formActs = [];
let formMts = [];
let selEsg = new Set();
let selTopics = new Set();

function load(){ try{ cases = JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ cases = []; }
  if(!cases.length){ cases = SEED.slice(); save(); } }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(cases)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nextNo(){ let mx = 0; cases.forEach(c=>{ const m = /^AL-(\d+)$/.exec(c.no||''); if(m) mx = Math.max(mx, +m[1]); }); return 'AL-' + String(mx+1).padStart(4,'0'); }
function fmtDate(s){ return s ? s.slice(0,10) : '—'; }
function timeRange(c){ return (c.startDate||'—') + ' ~ ' + (c.ongoing ? '持续开展' : (c.endDate||'—')); }

/* ================= 列表 ================= */
function visibleCases(){
  const kw = document.getElementById('f_kw').value.trim().toLowerCase();
  const cat = document.getElementById('f_cat').value;
  const ps  = document.getElementById('f_ps').value;
  const st  = document.getElementById('f_st').value;
  return cases
    .filter(c=> !cat || (c.esgCat||[]).includes(cat))
    .filter(c=> !ps || c.projStatus===ps)
    .filter(c=> !st || c.status===st)
    .filter(c=> !kw || ((c.title||'')+' '+(c.unit||'')+' '+(c.topics||[]).join(' ')).toLowerCase().includes(kw))
    .sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
}
function renderList(){
  const list = visibleCases();
  document.getElementById('cntTxt').textContent = '共 ' + cases.length + ' 条' + (list.length!==cases.length ? ' · 筛选出 ' + list.length + ' 条' : '');
  const el = document.getElementById('listWrap');
  if(!list.length){ el.innerHTML = '<div class="empty-hint">暂无匹配案例，点击右上角「＋ 新增案例」开始</div>'; return; }
  el.innerHTML = '<table class="cs-table"><thead><tr>'
    + '<th>案例名称</th><th>类别</th><th>关联议题</th><th>实施单位</th><th>实施时间</th><th>项目状态</th><th>状态</th><th>更新时间</th><th>操作</th>'
    + '</tr></thead><tbody>' + list.map(c=>'<tr>'
    + '<td><span class="cs-title" onclick="previewCase(\''+c.id+'\')">' + esc(c.title) + '</span><span class="cs-no">' + esc(c.no||'') + '</span></td>'
    + '<td class="cs-cats">' + (c.esgCat||[]).map(x=>'<span class="c-badge c-'+x.toLowerCase()+'">'+x+'</span>').join('') + '</td>'
    + '<td class="cs-topics">' + esc((c.topics||[]).join('、')) + '</td>'
    + '<td>' + esc(c.unit||'—') + '</td>'
    + '<td class="cs-time">' + esc(timeRange(c)) + '</td>'
    + '<td>' + esc(c.projStatus||'—') + '</td>'
    + '<td><span class="cs-status ' + (c.status==='final'?'st-final':'st-draft') + '">' + (c.status==='final'?'已定稿':'草稿') + '</span></td>'
    + '<td class="cs-time">' + fmtDate(c.updatedAt) + '</td>'
    + '<td class="cs-ops">'
    +   '<button onclick="previewCase(\''+c.id+'\')">预览</button>'
    +   '<button onclick="openEdit(\''+c.id+'\')">编辑</button>'
    +   '<button onclick="copyCase(\''+c.id+'\')">复制</button>'
    +   '<button class="del" onclick="delCase(\''+c.id+'\')">删除</button>'
    + '</td></tr>').join('') + '</tbody></table>';
}

/* ================= 编辑弹窗 ================= */
function fillSelect(id, arr, val){ document.getElementById(id).innerHTML = arr.map(x=>'<option'+(x===val?' selected':'')+'>'+x+'</option>').join(''); }
function renderEsgChips(){ document.getElementById('c_esg').innerHTML = ESG_CATS.map(x=>'<span class="chip-check'+(selEsg.has(x)?' on':'')+'" onclick="toggleEsg(\''+x+'\')">'+CAT_NAME[x]+'</span>').join(''); }
window.toggleEsg = function(x){ selEsg.has(x)?selEsg.delete(x):selEsg.add(x); renderEsgChips(); };
function allTopicOpts(){ const s = new Set(TOPIC_PRESETS); cases.forEach(c=>(c.topics||[]).forEach(t=>s.add(t))); selTopics.forEach(t=>s.add(t)); return [...s]; }
function renderTopicChips(){ document.getElementById('c_topics').innerHTML = allTopicOpts().map(t=>'<span class="chip-check'+(selTopics.has(t)?' on':'')+'" onclick="toggleTopic(\''+esc(t)+'\')">'+esc(t)+'</span>').join(''); }
window.toggleTopic = function(t){ selTopics.has(t)?selTopics.delete(t):selTopics.add(t); renderTopicChips(); };

function renderActs(){
  document.getElementById('actList').innerHTML = formActs.map((a,i)=>'<div class="dyn">'
    + '<button class="dyn-x" onclick="rmAct('+i+')" title="删除">✕</button>'
    + '<div class="dyn-no">行动 ' + (i+1) + '</div>'
    + '<div class="m-grid">'
    + '<div><label>行动标题</label><input class="input" value="'+esc(a.title)+'" onchange="formActs['+i+'].title=this.value"></div>'
    + '<div><label>责任单位/部门</label><input class="input" value="'+esc(a.owner||'')+'" onchange="formActs['+i+'].owner=this.value"></div>'
    + '<div class="full"><label>行动内容</label><textarea class="ta" style="min-height:52px" onchange="formActs['+i+'].content=this.value">'+esc(a.content||'')+'</textarea></div>'
    + '<div><label>实施时间</label><input class="input" value="'+esc(a.time||'')+'" onchange="formActs['+i+'].time=this.value" placeholder="例：2025年3—4月"></div>'
    + '</div></div>').join('');
}
window.rmAct = function(i){ formActs.splice(i,1); renderActs(); };

function renderMts(){
  document.getElementById('mtBody').innerHTML = formMts.map((m,i)=>'<tr>'
    + '<td><input class="input" value="'+esc(m.name)+'" onchange="formMts['+i+'].name=this.value"></td>'
    + '<td><input class="input" value="'+esc(m.base||'')+'" onchange="formMts['+i+'].base=this.value"></td>'
    + '<td><input class="input" value="'+esc(m.current||'')+'" onchange="formMts['+i+'].current=this.value"></td>'
    + '<td><input class="input" value="'+esc(m.unit||'')+'" onchange="formMts['+i+'].unit=this.value"></td>'
    + '<td><input class="input" value="'+esc(m.period||'')+'" onchange="formMts['+i+'].period=this.value"></td>'
    + '<td><input class="input" value="'+esc(m.scope||'')+'" onchange="formMts['+i+'].scope=this.value"></td>'
    + '<td><input class="input" value="'+esc(m.source||'')+'" onchange="formMts['+i+'].source=this.value"></td>'
    + '<td><button class="dyn-x" style="position:static" onclick="rmMt('+i+')" title="删除">✕</button></td></tr>').join('');
}
window.rmMt = function(i){ formMts.splice(i,1); renderMts(); };

function openModal(){
  document.getElementById('editMask').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('editMask').style.display = 'none';
  document.body.style.overflow = '';
}
function blankForm(){
  editingId = null;
  document.getElementById('mTitle').textContent = '新增案例';
  document.getElementById('mNo').textContent = '';
  ['c_title','c_unit','c_loc','c_bg','c_goal','c_outcome','c_benef','c_innov','c_partners','c_diff','c_next','c_links','c_scope','c_start','c_end'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('c_ongoing').checked = false;
  fillSelect('c_type', CASE_TYPES, CASE_TYPES[0]);
  fillSelect('c_status', PROJ_STATUS, PROJ_STATUS[0]);
  document.getElementById('c_secrecy').value = '可公开';
  document.getElementById('extraSec').open = false;
  selEsg = new Set(); selTopics = new Set();
  formActs = []; formMts = [];
  renderEsgChips(); renderTopicChips(); renderActs(); renderMts();
}
window.openEdit = function(id){
  const c = cases.find(x=>x.id===id); if(!c) return;
  blankForm(); editingId = id;
  document.getElementById('mTitle').textContent = '编辑案例';
  document.getElementById('mNo').textContent = (c.no||'') + ' · ' + (c.status==='final'?'已定稿':'草稿');
  document.getElementById('c_title').value = c.title||'';
  document.getElementById('c_unit').value = c.unit||'';
  document.getElementById('c_loc').value = c.location||'';
  document.getElementById('c_bg').value = c.background||'';
  document.getElementById('c_goal').value = c.goal||'';
  document.getElementById('c_outcome').value = c.outcome||'';
  document.getElementById('c_benef').value = c.benef||'';
  document.getElementById('c_innov').value = c.innovation||'';
  document.getElementById('c_partners').value = c.partners||'';
  document.getElementById('c_diff').value = c.difficulties||'';
  document.getElementById('c_next').value = c.nextPlan||'';
  document.getElementById('c_links').value = c.links||'';
  document.getElementById('c_scope').value = c.scope||'';
  document.getElementById('c_start').value = c.startDate||'';
  document.getElementById('c_end').value = c.endDate||'';
  document.getElementById('c_ongoing').checked = !!c.ongoing;
  fillSelect('c_type', CASE_TYPES, c.caseType||CASE_TYPES[0]);
  fillSelect('c_status', PROJ_STATUS, c.projStatus||PROJ_STATUS[0]);
  document.getElementById('c_secrecy').value = c.secrecy||'可公开';
  selEsg = new Set(c.esgCat||[]); selTopics = new Set(c.topics||[]);
  formActs = (c.actions||[]).map(a=>({title:a.title||'', content:a.content||'', owner:a.owner||'', time:a.time||''}));
  formMts = (c.metrics||[]).map(m=>({name:m.name||'', base:m.base||'', current:m.current||'', unit:m.unit||'', period:m.period||'', scope:m.scope||'', source:m.source||''}));
  renderEsgChips(); renderTopicChips(); renderActs(); renderMts();
  openModal();
};
function collectForm(status){
  return {
    title: document.getElementById('c_title').value.trim(),
    esgCat: [...selEsg], topics: [...selTopics],
    caseType: document.getElementById('c_type').value,
    projStatus: document.getElementById('c_status').value,
    unit: document.getElementById('c_unit').value.trim(),
    location: document.getElementById('c_loc').value.trim(),
    startDate: document.getElementById('c_start').value,
    endDate: document.getElementById('c_end').value,
    ongoing: document.getElementById('c_ongoing').checked,
    background: document.getElementById('c_bg').value.trim(),
    goal: document.getElementById('c_goal').value.trim(),
    actions: formActs.filter(a=>a.title || a.content),
    outcome: document.getElementById('c_outcome').value.trim(),
    benef: document.getElementById('c_benef').value.trim(),
    innovation: document.getElementById('c_innov').value.trim(),
    metrics: formMts.filter(m=>m.name),
    partners: document.getElementById('c_partners').value.trim(),
    difficulties: document.getElementById('c_diff').value.trim(),
    nextPlan: document.getElementById('c_next').value.trim(),
    links: document.getElementById('c_links').value.trim(),
    scope: document.getElementById('c_scope').value.trim(),
    secrecy: document.getElementById('c_secrecy').value,
    status: status
  };
}
function saveCase(asFinal){
  const d = collectForm(asFinal ? 'final' : 'draft');
  if(!d.title){ alert('请至少填写案例名称'); return; }
  if(asFinal){
    const missing = [];
    if(!d.esgCat.length) missing.push('ESG 类别');
    if(!d.unit) missing.push('实施单位');
    if(!d.startDate) missing.push('实施开始时间');
    if(!d.background) missing.push('背景与问题');
    if(!d.goal) missing.push('项目目标');
    if(!d.outcome) missing.push('成果与影响');
    if(d.metrics.length && !d.scope) missing.push('数据口径及来源（有量化指标时必填）');
    if(missing.length){ alert('定稿前请补充：\n· ' + missing.join('\n· ')); return; }
  }
  const now = new Date().toISOString();
  if(editingId){
    const c = cases.find(x=>x.id===editingId);
    Object.assign(c, d, {updatedAt: now});
  }else{
    cases.push(Object.assign({id: uid(), no: nextNo(), createdAt: now, updatedAt: now}, d));
  }
  save(); closeModal(); renderList();
}
window.copyCase = function(id){
  const c = cases.find(x=>x.id===id); if(!c) return;
  const now = new Date().toISOString();
  const cp = JSON.parse(JSON.stringify(c));
  cp.id = uid(); cp.no = nextNo(); cp.title = c.title + '（副本）'; cp.status = 'draft';
  cp.createdAt = now; cp.updatedAt = now;
  cases.push(cp); save(); renderList();
};
window.delCase = function(id){
  const c = cases.find(x=>x.id===id); if(!c) return;
  if(!confirm('删除案例「' + c.title + '」？此操作不可恢复。')) return;
  cases = cases.filter(x=>x.id!==id); save(); renderList();
};

/* ================= 预览 ================= */
window.previewCase = function(id){
  const c = cases.find(x=>x.id===id); if(!c) return;
  let h = '<h2>' + esc(c.title) + '</h2>'
    + '<div class="pv-meta">' + (c.no||'') + ' · ' + (c.esgCat||[]).map(x=>CAT_NAME[x]||x).join(' / ')
    + ' · ' + esc(c.caseType||'') + ' · ' + esc(c.unit||'') + ' · ' + esc(timeRange(c)) + (c.location?' · '+esc(c.location):'')
    + ' · ' + esc(c.projStatus||'') + '</div>';
  if(c.background) h += '<h5>背景与问题</h5><p>' + esc(c.background) + '</p>';
  if(c.goal) h += '<h5>项目目标</h5><p>' + esc(c.goal) + '</p>';
  if((c.actions||[]).length){
    h += '<h5>主要行动</h5>' + c.actions.map((a,i)=>'<p class="pv-act"><b>' + (i+1) + '. ' + esc(a.title||'行动') + '</b>'
      + (a.owner||a.time ? '<span style="color:#8a8f99;font-size:12px">（' + esc([a.owner,a.time].filter(Boolean).join(' · ')) + '）</span>' : '')
      + (a.content ? '<br>' + esc(a.content) : '') + '</p>').join('');
  }
  if(c.outcome) h += '<h5>成果与影响</h5><p>' + esc(c.outcome) + '</p>';
  if((c.metrics||[]).length){
    h += '<h5>量化成效指标</h5><table><thead><tr><th>指标名称</th><th>基准值</th><th>当期值</th><th>单位</th><th>统计期间</th><th>统计范围</th><th>数据来源</th></tr></thead><tbody>'
      + c.metrics.map(m=>'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.base||'—')+'</td><td>'+esc(m.current||'—')+'</td><td>'+esc(m.unit||'')+'</td><td>'+esc(m.period||'')+'</td><td>'+esc(m.scope||'')+'</td><td>'+esc(m.source||'')+'</td></tr>').join('')
      + '</tbody></table>';
  }
  if(c.benef) h += '<h5>受益对象</h5><p>' + esc(c.benef) + '</p>';
  if(c.innovation) h += '<h5>创新亮点及可复制价值</h5><p>' + esc(c.innovation) + '</p>';
  if(c.difficulties) h += '<h5>困难与经验</h5><p>' + esc(c.difficulties) + '</p>';
  if(c.nextPlan) h += '<h5>后续计划</h5><p>' + esc(c.nextPlan) + '</p>';
  if(c.partners) h += '<h5>合作机构</h5><p>' + esc(c.partners) + '</p>';
  if(c.scope) h += '<h5>数据口径及来源</h5><p>' + esc(c.scope) + '</p>';
  h += '<div class="pv-meta" style="margin-top:16px">信息公开级别：' + esc(c.secrecy||'—') + ' · 状态：' + (c.status==='final'?'已定稿':'草稿') + ' · 更新于 ' + fmtDate(c.updatedAt) + '</div>';
  document.getElementById('pvDoc').innerHTML = h;
  document.getElementById('pvMask').style.display = 'flex';
  document.body.style.overflow = 'hidden';
};
function closePv(){ document.getElementById('pvMask').style.display = 'none'; document.body.style.overflow = ''; }

/* ================= Excel 模板 ================= */
function buildTemplate(){
  const wb = XLSX.utils.book_new();
  const mainHeaders = ['案例编号','案例名称','ESG类别(E/S/G)','关联议题','案例类型','实施单位','实施开始','实施结束(持续开展填"持续")','实施地点','项目状态','背景与问题','项目目标','主要行动(序号.标题:内容)','成果与影响','受益对象','创新亮点','困难与经验','后续计划','合作机构','公开来源链接','数据口径及来源','信息公开级别'];
  const main = [mainHeaders,
    ['AL-0001','【示例】厂区分布式光伏项目实现年减排约800吨','E','气候变化、能源管理','运营改善','华南分公司','2025-03-01','2025-09-30','广东省深圳市','已完成','园区用电全部依赖市电……','年发电不低于110万kWh……','1.完成方案设计:屋顶评估与1.1MWp方案; 2.招标施工:EPC建设并网','首年发电118万kWh，节约电费约86万元……','公司、电网、社区','自发自用+能管系统联动，可复制','','评估二期扩建','区供电局、EPC总包方','','发电量来自能源管理系统月度报表，未经第三方核查','可公开']];
  const ws1 = XLSX.utils.aoa_to_sheet(main);
  ws1['!cols'] = mainHeaders.map(()=>({wch:16}));
  XLSX.utils.book_append_sheet(wb, ws1, '案例主表');
  const mtHeaders = ['案例编号','指标名称','基准值','当期值','单位','统计期间','统计范围','数据来源'];
  const ws2 = XLSX.utils.aoa_to_sheet([mtHeaders, ['AL-0001','年发电量','0','118','万kWh','2025.10—2026.09','光明区产业园','能源管理系统']]);
  ws2['!cols'] = mtHeaders.map(()=>({wch:14}));
  XLSX.utils.book_append_sheet(wb, ws2, '成效指标表');
  const attHeaders = ['案例编号','附件名称','材料类型','数据期间','保密级别'];
  const ws3 = XLSX.utils.aoa_to_sheet([attHeaders, ['AL-0001','2025年度电费结算单.pdf','统计报表','2025年度','仅内部使用']]);
  ws3['!cols'] = attHeaders.map(()=>({wch:18}));
  XLSX.utils.book_append_sheet(wb, ws3, '附件清单');
  return wb;
}
function downloadTemplate(){
  XLSX.writeFile(buildTemplate(), 'ESG案例填报模板.xlsx');
}

/* ================= 事件绑定 ================= */
document.getElementById('btnNew').onclick = ()=>{ blankForm(); openModal(); };
document.getElementById('mClose').onclick = closeModal;
document.getElementById('btnCancel').onclick = closeModal;
document.getElementById('btnSaveDraft').onclick = ()=>saveCase(false);
document.getElementById('btnSaveFinal').onclick = ()=>saveCase(true);
document.getElementById('btnAddAct').onclick = ()=>{ formActs.push({title:'',content:'',owner:'',time:''}); renderActs(); };
document.getElementById('btnAddMt').onclick = ()=>{ formMts.push({name:'',base:'',current:'',unit:'',period:'',scope:'',source:''}); renderMts(); };
document.getElementById('btnAddTopic').onclick = ()=>{
  const v = document.getElementById('c_topicCustom').value.trim();
  if(!v) return;
  selTopics.add(v); document.getElementById('c_topicCustom').value=''; renderTopicChips();
};
document.getElementById('btnTpl').onclick = downloadTemplate;
['f_kw','f_cat','f_ps','f_st'].forEach(id=>{
  document.getElementById(id).addEventListener('input', renderList);
  document.getElementById(id).addEventListener('change', renderList);
});
document.getElementById('pvClose').onclick = closePv;
document.getElementById('pvOk').onclick = closePv;
document.getElementById('editMask').addEventListener('click', e=>{ if(e.target.id==='editMask') closeModal(); });
document.getElementById('pvMask').addEventListener('click', e=>{ if(e.target.id==='pvMask') closePv(); });
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('editMask').style.display==='flex') closeModal();
  else if(document.getElementById('pvMask').style.display==='flex') closePv();
});

/* ================= 启动 ================= */
load();
document.getElementById('f_ps').innerHTML = '<option value="">全部项目状态</option>' + PROJ_STATUS.map(x=>'<option>'+x+'</option>').join('');
renderList();
